name: Pennywise Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android/**

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out Pennywise
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: yarn

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Test Savings Insights analysis
        run: yarn workspace @actual-app/web test src/components/savings-insights/analysis.test.ts

      - name: Build mobile web bundle
        run: yarn build:browser --mobile

      - name: Build Android APK
        run: yarn workspace mobile-client build:android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pennywise-android-debug
          path: packages/mobile-client/build/app-debug.apk
          if-no-files-found: error
          retention-days: 14
